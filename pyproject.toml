[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "geopolitical-impact-analyzer"
version = "1.0.0"
description = "Analyzing tariffs and regional conflicts impact on stock prices through Directional Changes and LLMs"
requires-python = ">=3.10"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
include = ["src*"]
